<ion-header [translucent]="true">
  <app-menupage></app-menupage>
  <ion-toolbar>
    <ion-title>Productos — {{ type }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="shop-products-content">
  <ng-container *ngIf="!loading; else loadingTpl">
    <ng-container *ngIf="products?.length > 0; else emptyTpl">
      <div class="products-grid">
        <ion-card class="product-card" *ngFor="let p of products; trackBy: trackByUid">
          <!-- Controles de carrito -->
          <div class="cart-controls"
               style="position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:2; pointer-events:auto;">
            <ion-button size="small" fill="clear" color="medium" (click)="decreaseQty(p)">
              <ion-icon name="remove-circle-outline"></ion-icon>
            </ion-button>
            <ion-badge color="dark">{{ cartQuantity(p.uid) || 0 }}</ion-badge>
            <ion-button size="small" fill="clear" color="primary" (click)="increaseQty(p)">
              <ion-icon name="add-circle-outline"></ion-icon>
            </ion-button>
          </div>

          <img [src]="p.product_image || 'assets/placeholder-product.png'" [alt]="p.product_name" />
          <ion-card-header>
            <ion-card-title>{{ p.product_name }}</ion-card-title>
            <ion-card-subtitle>{{ p.type }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <div class="product-price">
              {{ p.price | currency }}
            </div>
          </ion-card-content>
        </ion-card>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #loadingTpl>
    <div class="products-grid">
      <ion-card class="product-card" *ngFor="let sk of [1,2,3,4,5,6]">
        <ion-skeleton-text animated style="width: 100%; height: 160px;"></ion-skeleton-text>
        <ion-card-header>
          <ion-skeleton-text animated style="width: 60%;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 40%;"></ion-skeleton-text>
        </ion-card-header>
        <ion-card-content>
          <ion-skeleton-text animated style="width: 30%;"></ion-skeleton-text>
        </ion-card-content>
      </ion-card>
    </div>
  </ng-template>

  <ng-template #emptyTpl>
    <div class="empty-state">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <h3>No hay productos en {{ type }}</h3>
      <p>Prueba otra categoría desde el menú.</p>
    </div>
  </ng-template>
</ion-content>
